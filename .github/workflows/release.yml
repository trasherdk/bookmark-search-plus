name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check tag matches manifest
        run: node scripts/package.mjs --check-tag

      - name: Package extension
        run: node scripts/package.mjs

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "dist/bookmark-search-plus-${VERSION}.zip" \
            --title "Bookmark Search Plus ${GITHUB_REF_NAME}" \
            --generate-notes
